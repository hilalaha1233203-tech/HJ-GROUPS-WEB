<!doctype html>
<html lang="en">
  <body style="margin:0;background:#080b18;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:560px;margin:40px auto;padding:28px;border:1px solid #262b4a;border-radius:18px;background:#11162a;">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="{{ .SiteURL }}/hj-groups-logo.png" alt="HJ GROUPS" style="max-width:180px;height:auto;">
      </div>

      <h2 style="margin:0 0 10px;text-align:center;">HJ GROUPS verification code</h2>
      <p style="margin:0 0 20px;color:#aeb4cf;text-align:center;line-height:1.6;">
        Use the one-time code below to continue signing in or creating your HJ GROUPS account.
      </p>

      <div style="margin:24px auto;padding:18px;border:1px solid #4a50a5;border-radius:14px;background:#0b1020;text-align:center;">
        <div style="font-size:32px;font-weight:800;letter-spacing:8px;color:#7c83ff;">
          {{ .Token }}
        </div>
      </div>

      <p style="margin:0;color:#858ca7;font-size:12px;line-height:1.6;text-align:center;">
        This code expires according to your Supabase Auth email OTP settings. Never share this code with anyone.
      </p>

      <p style="margin:22px 0 0;color:#666d87;font-size:11px;text-align:center;">
        {{ .Email }}
      </p>
    </div>
  </body>
</html>
