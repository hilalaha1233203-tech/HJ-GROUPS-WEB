name: Fix content sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[content-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run content sync patcher
        run: python3 .github/scripts/fix_content_sync.py

      - name: Run player hardening patcher
        run: python3 .github/scripts/fix_player.py

      - name: Run access-control hardening patcher
        run: python3 .github/scripts/fix_access_control.py

      - name: Run reader access hardening patcher
        run: python3 .github/scripts/fix_reader_access.py

      - name: Run EPUB unlock flow patcher
        run: python3 .github/scripts/fix_reader_access2.py

      - name: Run final reader hardening patcher
        run: python3 .github/scripts/fix_reader_final.py

      - name: Guarantee App exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          if 'export function App(' not in s:
              s = s.replace('function App() {', 'export function App() {', 1)
          if 'export default App' not in s:
              s = s.rstrip() + '\n\nexport default App\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/AdminPanel.jsx src/App.css
          git diff --cached --quiet && exit 0
          git commit -m '[content-sync] persist admin stories and episodes in Supabase'
          git push
