name: HJ GROUPS Playwright Website Health

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run public website health scan
        env:
          PLAYWRIGHT_BASE_URL: https://hj-groups-website.getvoroa.com
          STRICT_QA: 'true'
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hj-groups-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hj-groups-playwright-test-results
          path: test-results/
          if-no-files-found: ignore
