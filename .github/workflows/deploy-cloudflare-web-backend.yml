name: Deploy HJ GROUPS Cloudflare Backend Container

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-backend/**"
      - "server.mjs"
      - "server/**"
      - "src/lib/adUnlockRules.js"
      - ".github/workflows/deploy-cloudflare-web-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "ec2a5b66d2fd2cd79359c5d928316739"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker source
        run: node --check src/index.js

      - name: Install Wrangler and Containers package
        run: npm install --no-package-lock --ignore-scripts

      - name: Wrangler dry run
        run: npx wrangler@4.146.0 deploy --dry-run --outdir .wrangler-dry-run

      - name: Deploy production Container Worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; production deployment intentionally skipped."
            exit 0
          fi
          npx wrangler@4.146.0 deploy
