name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Dependency audit (production)
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const child = require('node:child_process')
          let stdout = ''
          try {
            stdout = execFileSync('npm', ['audit', '--omit=dev', '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] })
          } catch (error) {
            stdout = String(error.stdout || '')
            const stderr = String(error.stderr || '')
            if (stderr) process.stderr.write(stderr)
          }
          if (!stdout.trim()) throw new Error('npm audit returned no JSON output')
          const report = JSON.parse(stdout)
          const metadata = report.metadata || {}
          console.log('npm audit metadata:', JSON.stringify(metadata.vulnerabilities || {}, null, 2))
          const vulnerabilities = report.vulnerabilities || {}
          const serious = Object.entries(vulnerabilities)
            .filter(([, item]) => ['high', 'critical'].includes(item.severity))
            .map(([name, item]) => ({ name, severity: item.severity, range: item.range, via: item.via, fixAvailable: item.fixAvailable }))
          if (serious.length) {
            console.error('High/Critical production vulnerabilities detected:')
            console.error(JSON.stringify(serious, null, 2))
            process.exit(1)
          }
          console.log('No high/critical production dependency vulnerabilities found.')
          NODE

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Server / payment / shortener unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Verify Supabase migration filenames
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = path.join(process.cwd(), 'supabase', 'migrations')
          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter((name) => name.endsWith('.sql'))
            : []
          for (const file of files) {
            if (!/^\d{14}_[A-Za-z0-9._-]+\.sql$/.test(file)) {
              throw new Error('Supabase migration filename must use <14-digit-timestamp>_<name>.sql: ' + file)
            }
          }
          if (!files.length) throw new Error('No Supabase migrations found')
          console.log('Supabase migration filename checks passed:', files.length)
          NODE

      - name: Verify critical startup exports
        run: |
          test -s src/App.jsx
          grep -q "export function App(" src/App.jsx
          test -s src/main.jsx
          grep -q "import { App } from './App.jsx'" src/main.jsx
          test -s index.html
          grep -q 'id="root"' index.html

      - name: Verify Vite output exists
        run: test -f dist/index.html

      - name: Verify Pages Functions and routes manifest
        shell: bash
        run: |
          set -euo pipefail
          for f in "functions/[[path]].js" functions/_lib/*.js functions/api/*.js; do
            node --check "$f"
          done
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('public/_routes.json','utf8')); if(p.version!==1 || !Array.isArray(p.include) || !p.include.includes('/api/*')) process.exit(1); console.log('Pages Functions routes manifest validated')"

      - name: Verify production path has no container backend
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'HJ_WEB_BACKEND_URL|@cloudflare/containers|node:|process\.env\.|Buffer\.(from|alloc|concat)|child_process|from ["']node:' functions src
          test ! -e Dockerfile
          test ! -e cloudflare-backend/package.json
          test ! -e cloudflare-backend/wrangler.jsonc
          test ! -e .github/workflows/deploy-cloudflare-web-backend.yml
          ! grep -RInE 'HJ_WEB_BACKEND_URL|@cloudflare/containers' public dist 2>/dev/null

      - name: Pages preview route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.146.0 pages dev dist --functions functions --ip 127.0.0.1 --port 8788 > /tmp/hj-pages.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8788/health" > /tmp/hj-pages-health.json; then
              cat /tmp/hj-pages-health.json
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/hj-pages.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/hj-pages-health.json
          PAGES_TEST_URL="http://127.0.0.1:8788" npm run test:pages

      - name: Verify frontend build contains no server-only secret identifiers
        shell: bash
        run: |
          set -euo pipefail
          forbidden_vite='import\\.meta\\.env\\.VITE_(SUPABASE_SERVICE_ROLE_KEY|CASHFREE_CLIENT_SECRET|UNLOCK_TOKEN_SECRET|AROLINKS_API_TOKEN|EARN4LINK_API_TOKEN|WEB_PUSH_VAPID_PRIVATE_KEY|HJ_GITHUB_ACTIONS_TOKEN|TELEGRAM_BOT_TOKEN|TELEGRAM_USER_SESSION_STRING|API_HASH)'
          forbidden_server_env='process\\.env\\.(SUPABASE_SERVICE_ROLE_KEY|CASHFREE_CLIENT_SECRET|UNLOCK_TOKEN_SECRET|AROLINKS_API_TOKEN|EARN4LINK_API_TOKEN|WEB_PUSH_VAPID_PRIVATE_KEY|HJ_GITHUB_ACTIONS_TOKEN|TELEGRAM_BOT_TOKEN|TELEGRAM_USER_SESSION_STRING|API_HASH)|context\\.env\\.(SUPABASE_SERVICE_ROLE_KEY|CASHFREE_CLIENT_SECRET|UNLOCK_TOKEN_SECRET|AROLINKS_API_TOKEN|EARN4LINK_API_TOKEN|WEB_PUSH_VAPID_PRIVATE_KEY|HJ_GITHUB_ACTIONS_TOKEN|TELEGRAM_BOT_TOKEN|TELEGRAM_USER_SESSION_STRING|API_HASH)'
          if grep -R -nE "$forbidden_vite" dist src functions 2>/dev/null; then
            echo "::error::Forbidden VITE_ secret access found in frontend/Pages source or build output."
            exit 1
          fi
          if grep -R -nE "$forbidden_server_env" dist src functions 2>/dev/null; then
            echo "::error::Server-only secret environment access found in frontend/Pages source or build output."
            exit 1
          fi
          echo "Frontend build secret-access scan passed; no server-only secret environment access was emitted."


      - name: Auth / settings / metadata sanity check
        run: |
          node <<'NODE'
          const fs = require('fs')
          const read = (p) => fs.readFileSync(p, 'utf8')
          const checks = [
            ['src/lib/authRedirect.js', 'PRODUCTION_SITE_URL'],
            ['src/lib/authRecovery.js', 'PASSWORD_RESET_PATH'],
            ['src/lib/authRecovery.js', 'getAuthRecoveryParams'],
            ['src/lib/authRecovery.js', 'cleanAuthCallbackUrl'],
            ['src/components/PasswordInput.jsx', 'Show password'],
            ['src/components/PasswordInput.jsx', 'Hide password'],
            ['src/Auth.jsx', 'getAuthRedirectUrl'],
            ['src/Auth.jsx', 'productionSafe: true'],
            ['src/Auth.jsx', 'PASSWORD_RESET_PATH'],
            ['src/AccountSettings.jsx', 'supportTelegramUrl'],
            ['src/AdminPanel.jsx', 'supportTelegramUrl'],
            ['src/App.jsx', '/api/public-settings'],
            ['src/lib/appearance.js', 'normalizeAppearance'],
            ['src/lib/appearance.js', 'prefers-reduced-motion'],
            ['src/components/AdminAnalyticsCharts.jsx', 'echarts@6.1.0'],
            ['src/AdminPanel.jsx', 'AdminAnalyticsCharts'],
            ['src/AdminPanel.jsx', 'security_findings'],
            ['src/AdminPanel.jsx', 'Typography, Color & Motion'],
            ['src/AdminPanel.jsx', 'Emoji style'],
            ['src/AdminPanel.jsx', 'EMOJI_STYLES'],
            ['supabase/functions/hj-security-monitor/index.ts', 'security_scans'],
            ['supabase/functions/hj-security-monitor/index.ts', 'SUPABASE_SECRET_KEYS'],
            ['supabase/migrations/20261003130000_security_monitoring.sql', 'security_findings'],
            ['supabase/migrations/20261003130000_security_monitoring.sql', 'hj-groups-daily-security-scan'],
            ['server.mjs', '/api/public-settings'],
            ['server.mjs', 'Public settings unavailable'],

            ['src/Auth.jsx', 'shouldCreateUser: false'],
            ['src/Auth.jsx', 'signInWithOAuth'],
            ['src/Auth.jsx', 'shouldCreateUser: true'],
            ['src/Auth.jsx', 'Email OTP Sign Up'],
            ['src/Auth.jsx', 'Phone OTP Login'],
            ['src/Auth.jsx', 'Forgot Password'],
            ['src/AccountSettings.jsx', 'productionSafe: true'],
            ['src/AccountSettings.jsx', 'PASSWORD_RESET_PATH'],
            ['src/App.jsx', 'getAuthRecoveryParams'],
            ['src/App.jsx', 'cleanAuthCallbackUrl'],
            ['src/App.jsx', 'PASSWORD_RECOVERY'],
            ['src/App.jsx', 'passwordRecoveryStatus'],
            ['src/App.jsx', 'requestNewRecoveryEmail'],
            ['src/App.jsx', 'updateUser({'],
            ['src/App.jsx', 'password: recoveryPassword'],
            ['src/App.jsx', 'signOut({ scope: \'local\' })'],
            ['src/App.jsx', 'AccountSettings'],
            ['src/App.jsx', 'account-settings'],
            ['src/App.css', 'reader-theme-paper'],
            ['src/App.jsx', 'readerPositionRestoredRef'],
            ['src/App.jsx', 'reduced-motion'],
            ['src/App.css', '.app.reduced-motion'],
            ['src/App.jsx', 'preload={accountSettings.dataSaver ? \'metadata\' : \'auto\'}'],
            ['src/App.jsx', 'applyEpubReaderAppearance'],
            ['src/App.jsx', 'Read Aloud'],
            ['src/AdminPanel.jsx', 'Management & Settings'],
            ['src/AdminPanel.jsx', 'Default Access Rules'],
            ['src/AdminPanel.jsx', 'Audio Access Types'],
            ['src/AdminPanel.jsx', 'Video Access Types'],
            ['src/AdminPanel.jsx', 'Book Access Types'],
            ['src/AdminPanel.jsx', "function AccessTypeSelect({ groupName, label = 'Access Types', value, onChange })"],
            ['src/AdminPanel.jsx', '<span className="access-type-label">{label}</span>'],
            ['src/App.jsx', 'const [storyEpisodeRangeStart, setStoryEpisodeRangeStart] = useState(0)'],
            ['src/App.jsx', 'const [storyEpisodeVisibleEnd, setStoryEpisodeVisibleEnd] = useState(50)'],
            ['src/App.jsx', 'aria-label="Episode ranges"'],
            ['src/App.jsx', 'Load More Episodes'],
            ['src/App.css', '.episode-range-nav'],
            ['src/App.css', '.episode-load-more'],
            ['src/App.jsx', 'This episode will load in a few seconds depending on your network.'],
            ['src/App.jsx', 'This video will load in a few seconds depending on your network.'],
            ['src/App.jsx', 'This book will load in a few seconds depending on your network.'],
            ['src/App.jsx', 'media-loading-toast'],
            ['src/App.css', '.media-loading-toast'],
            ['src/AdminPanel.jsx', 'AroLinks'],
            ['src/AdminPanel.jsx', 'Earn4Link'],
            ['server/shortenerUnlock.mjs', 'AROLINKS_API_TOKEN'],
            ['server/shortenerUnlock.mjs', 'EARN4LINK_API_TOKEN'],
            ['server/rewardedAdUnlock.mjs', 'UNLOCK_TOKEN_SECRET'],
            ['server/rewardedAdUnlock.mjs', 'SUPABASE_SERVICE_ROLE_KEY'],
            ['src/App.jsx', '/api/ads/start'],
            ['src/App.jsx', '/api/ads/complete'],
            ['src/App.jsx', 'shortener_unlock_started'],
            ['src/App.jsx', 'shortener_unlock_completed'],
            ['src/App.jsx', '/api/shortener/start'],
            ['src/App.jsx', '/api/shortener/complete'],
            ['src/lib/secureMedia.js', '/api/shortener/access'],
            ['supabase/production-shortener-unlock.sql', 'shortener_links'],
            ['supabase/production-shortener-unlock.sql', 'ad_unlocks'],
            ['src/AdminPanel.jsx', 'freeVideoEpisodes'],
            ['src/AdminPanel.jsx', 'content_access_settings'],
            ['src/App.jsx', 'isEpisodePreviewFree'],
            ['src/lib/secureMedia.js', "const protectedTypes = new Set(['premium', 'vip', 'ads'])"],
            ['supabase/production-content-repair.sql', 'create table if not exists public.app_settings'],
            ['supabase/email-templates/magic_link_otp.html', '{{ .Token }}'],
            ['server/payment.mjs', 'CASHFREE_CLIENT_SECRET'],
            ['server/payment.mjs', '/api/payments/create-order'],
            ['server/payment.mjs', '/api/payments/webhook'],
            ['server/payment.mjs', 'CASHFREE_API_VERSION'],
            ['supabase/production-cashfree-payments.sql', 'payment_orders'],
            ['src/lib/accessControl.js', 'hasVipAccess'],
            ['src/App.jsx', '/api/vip-access'],
            ['src/AdminPanel.jsx', '/api/admin/vip-access'],
            ['server/vipAccess.mjs', 'user_vip_grants'],
            ['server/shortenerUnlock.mjs', 'hasActiveVipGrant'],
            ['supabase/migrations/20261004030000_user_vip_grants.sql', 'user_vip_grants_admin_select'],
          ]
          for (const [file, needle] of checks) {
            if (!read(file).includes(needle)) throw new Error(`Missing required text: ${file} :: ${needle}`)
          }
          const app = read('src/App.jsx')
          if (app.includes('seedBooks') || app.includes('/books/sample.pdf') || app.includes('/books/sample.epub')) {
            throw new Error('Legacy book seed/test references remain in src/App.jsx')
          }
          const template = read('supabase/email-templates/magic_link_otp.html')
          if (template.includes('{{ .ConfirmationURL }}')) throw new Error('Legacy confirmation URL remains in email template')
          const passwordSources = ['src/Auth.jsx', 'src/AccountSettings.jsx', 'src/App.jsx']
          for (const file of passwordSources) {
            const source = read(file)
            if (/<input\b[^>]*\btype=(["'])password\1/i.test(source)) {
              throw new Error('Raw password input remains outside PasswordInput component: ' + file)
            }
          }
          const appSource = read('src/App.jsx')
          const recoveryListenerIndex = appSource.indexOf("supabase.auth.onAuthStateChange")
          const recoveryStartIndex = appSource.indexOf("const finishAuthRedirect = async")
          if (recoveryListenerIndex < 0 || recoveryStartIndex < 0 || recoveryListenerIndex > recoveryStartIndex) {
            throw new Error('PASSWORD_RECOVERY listener must be registered before auth callback processing')
          }
          if (!appSource.includes('path: PASSWORD_RESET_PATH')) throw new Error('Dedicated password-reset path is missing from App.jsx')
          if (appSource.includes('account-recovery-overlay')) throw new Error('Legacy recovery modal wrapper remains in App.jsx')

          const paymentSource = read('server/payment.mjs')
          for (const secret of ['CASHFREE_CLIENT_SECRET', 'SUPABASE_SERVICE_ROLE_KEY']) {
            if (paymentSource.includes('VITE_' + secret)) throw new Error('Payment secret exposed through VITE_ env: ' + secret)
          }
          for (const file of ['src/App.jsx','src/Auth.jsx','src/App.css','src/AccountSettings.jsx','src/AdminPanel.jsx','src/lib/secureMedia.js','server/shortenerUnlock.mjs','server/payment.mjs','src/components/PaymentModal.jsx','src/main.jsx','index.html','supabase/production-shortener-unlock.sql','supabase/production-content-repair.sql','supabase/email-templates/magic_link_otp.html']) {
            if (read(file).includes('localhost:3000')) throw new Error(`localhost:3000 remains in ${file}`)
          }
          console.log('Auth/settings/source sanity checks passed')
          NODE

      - name: Appearance / security monitoring sanity check
        run: |
          node <<'NODE'
          const fs = require('fs')
          const checks = [
            ['src/lib/appearance.js', 'FONT_OPTIONS'],
            ['src/lib/appearance.js', 'ANIMATION_INTENSITIES'],
            ['src/lib/appearance.js', 'EMOJI_STYLES'],
            ['src/lib/appearance.js', 'installEmojiEnhancer'],
            ['src/lib/appearance.js', 'MutationObserver'],
            ['src/lib/appearance.js', 'Noto Sans Tamil'],
            ['src/lib/appearance.js', 'Space Grotesk'],
            ['src/lib/appearance.js', 'Bricolage Grotesque'],
            ['src/lib/appearance.js', 'normalizeAppearance'],
            ['src/lib/appearance.js', 'prefers-reduced-motion'],
            ['src/components/AdminAnalyticsCharts.jsx', 'echarts@6.1.0'],
            ['src/AdminPanel.jsx', 'security_findings'],
            ['src/AdminPanel.jsx', 'Typography, Color & Motion'],
            ['supabase/functions/hj-security-monitor/index.ts', 'security_monitor_snapshot'],
            ['supabase/functions/hj-security-monitor/index.ts', 'x-hj-monitor-key'],
            ['supabase/migrations/20261003130000_security_monitoring.sql', 'hj_security_monitor_key'],
          ]
          for (const [file, needle] of checks) {
            if (!fs.readFileSync(file, 'utf8').includes(needle)) throw new Error('Missing monitoring/appearance check: ' + file + ' :: ' + needle)
          }
          const appearance = fs.readFileSync('src/lib/appearance.js','utf8')
          if (!appearance.includes('EMOJI_STYLES') || !appearance.includes('MutationObserver')) throw new Error('Dynamic emoji animation implementation is incomplete')
          if (!appearance.includes('Noto Serif Tamil') || !appearance.includes('Space Grotesk')) throw new Error('Expanded typography configuration is incomplete')
          if (appearance.includes('dangerouslySetInnerHTML') || appearance.includes('eval(')) throw new Error('Arbitrary HTML/JS injection path found in appearance system')
          const monitor = fs.readFileSync('supabase/functions/hj-security-monitor/index.ts','utf8')
          if (monitor.includes('console.log(serviceKey') || monitor.includes('console.log(secretKey')) throw new Error('Security monitor must not log secret keys')
          console.log('Appearance and security-monitoring sanity checks passed')
          NODE

      - name: Final source sanity check
        run: |
          ! grep -R -n "story?.id" src/App.jsx
          test -s src/AccountSettings.jsx
          test -s src/components/PasswordInput.jsx
          test -s src/lib/authRedirect.js
          test -s src/lib/authRecovery.js
          grep -q "linkIdentity" src/AccountSettings.jsx
          grep -q "supportTelegramUrl" src/AdminPanel.jsx
          grep -q "supportTelegramUrl" src/AccountSettings.jsx
          grep -q "/api/public-settings" server.mjs
          grep -q "getAuthRedirectUrl" src/Auth.jsx
          grep -q "productionSafe: true" src/Auth.jsx
          grep -q "PASSWORD_RESET_PATH" src/Auth.jsx
          grep -q "PASSWORD_RESET_PATH" src/AccountSettings.jsx
          grep -q "PASSWORD_RECOVERY" src/App.jsx
          grep -q "getAuthRecoveryParams" src/App.jsx
          grep -q "cleanAuthCallbackUrl" src/App.jsx
          grep -q "Show password" src/components/PasswordInput.jsx
          grep -q "Hide password" src/components/PasswordInput.jsx
          grep -q "phone_change" src/AccountSettings.jsx
          grep -q "scope: 'global'" src/AccountSettings.jsx
          grep -q "getMediaPositionKey" src/App.jsx
          grep -q "dataSaver" src/App.jsx
          grep -q "hj_settings" src/App.jsx
          grep -q "reader-read-aloud-main" src/App.jsx
          grep -q "reader-bottom-read-aloud-row" src/App.jsx
          grep -q "accountSettings.ttsVolume" src/App.jsx
          grep -q "accountSettings.ttsSpeed" src/App.jsx
          grep -q "applyEpubReaderAppearance" src/App.jsx
          grep -q "reader-tools" src/App.css
          grep -q "reader-bottom-read-aloud-row" src/App.css
          ! awk '/^\.reader-body \.react-pdf__Page canvas \{/{flag=1} flag{print} /^\}/{if(flag){exit}}' src/App.css | grep -Eq "width:[[:space:]]*auto|height:[[:space:]]*auto"
          grep -q "max-width: none !important" src/App.css
          grep -q "reader-theme-paper" src/App.css
