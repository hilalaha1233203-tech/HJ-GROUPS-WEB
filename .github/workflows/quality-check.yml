name: Quality Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Server / shortener unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Verify shortener server syntax
        run: node --check server.mjs && node --check server/shortenerUnlock.mjs

      - name: Verify critical startup exports
        run: |
          test -s src/App.jsx
          grep -q "export function App(" src/App.jsx
          test -s src/main.jsx
          grep -q "import { App } from './App.jsx'" src/main.jsx
          test -s index.html
          grep -q 'id="root"' index.html

      - name: Verify Vite output exists
        run: test -f dist/index.html

      - name: Auth / settings / metadata sanity check
        run: |
          grep -q "shouldCreateUser: false" src/Auth.jsx
          grep -q "signInWithOAuth" src/Auth.jsx
          grep -q "shouldCreateUser: true" src/Auth.jsx
          grep -q "Email OTP Sign Up" src/Auth.jsx
          grep -q "Phone OTP Login" src/Auth.jsx
          grep -q "Forgot Password" src/Auth.jsx
          grep -q "finishAuthRedirect" src/App.jsx
          grep -q "PASSWORD_RECOVERY" src/App.jsx
          grep -q "AccountSettings" src/App.jsx
          grep -q "account-settings" src/App.jsx
          grep -q "reader-theme-paper" src/App.css
          grep -q "readerPositionRestoredRef" src/App.jsx
          grep -q "reduced-motion" src/App.jsx
          grep -q ".app.reduced-motion" src/App.css
          grep -q "preload={accountSettings.dataSaver ? 'metadata' : 'auto'}" src/App.jsx
          grep -q "applyEpubReaderAppearance" src/App.jsx
          grep -q "Read Aloud" src/App.jsx
          grep -q "Management & Settings" src/AdminPanel.jsx
          grep -q "AroLinks" src/AdminPanel.jsx
          grep -q "Earn4Link" src/AdminPanel.jsx
          grep -q "AROLINKS_API_TOKEN" server/shortenerUnlock.mjs
          grep -q "EARN4LINK_API_TOKEN" server/shortenerUnlock.mjs
          grep -q "/api/shortener/start" src/App.jsx
          grep -q "/api/shortener/complete" src/App.jsx
          grep -q "/api/shortener/access" src/lib/secureMedia.js
          grep -q "shortener_links" supabase/production-shortener-unlock.sql
          grep -q "ad_unlocks" supabase/production-shortener-unlock.sql
          grep -q "freeVideoEpisodes" src/AdminPanel.jsx
          grep -q "content_access_settings" src/AdminPanel.jsx
          grep -q "isEpisodePreviewFree" src/App.jsx
          grep -q "isBookPreviewPageFree" src/App.jsx
          ! grep -q "sample.pdf" src/App.jsx
          ! grep -q "sample.epub" src/App.jsx
          grep -q "const protectedTypes = new Set(['premium', 'vip', 'ads'])" src/lib/secureMedia.js
          grep -q "create table if not exists public.app_settings" supabase/production-content-repair.sql
          grep -q "{{ .Token }}" supabase/email-templates/magic_link_otp.html
          ! grep -q "{{ .ConfirmationURL }}" supabase/email-templates/magic_link_otp.html
          ! git grep -n "localhost:3000" -- src supabase/email-templates

      - name: Final source sanity check
        run: |
          ! grep -R -n "story?.id" src/App.jsx
          test -s src/AccountSettings.jsx
          grep -q "linkIdentity" src/AccountSettings.jsx
          grep -q "phone_change" src/AccountSettings.jsx
          grep -q "scope: 'global'" src/AccountSettings.jsx
          grep -q "getMediaPositionKey" src/App.jsx
          grep -q "dataSaver" src/App.jsx
          grep -q "hj_settings" src/App.jsx
          grep -q "reader-read-aloud-main" src/App.jsx
          grep -q "reader-bottom-read-aloud-row" src/App.jsx
          grep -q "accountSettings.ttsVolume" src/App.jsx
          grep -q "accountSettings.ttsSpeed" src/App.jsx
          grep -q "applyEpubReaderAppearance" src/App.jsx
          grep -q "reader-tools" src/App.css
          grep -q "reader-bottom-read-aloud-row" src/App.css
          ! awk '/^\.reader-body \.react-pdf__Page canvas \{/{flag=1} flag{print} /^\}/{if(flag){exit}}' src/App.css | grep -Eq "width:[[:space:]]*auto|height:[[:space:]]*auto"
          grep -q "max-width: none !important" src/App.css
          grep -q "reader-theme-paper" src/App.css
