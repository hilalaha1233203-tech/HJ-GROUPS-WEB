name: Quality Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Server / shortener unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Verify shortener server syntax
        run: node --check server.mjs && node --check server/shortenerUnlock.mjs

      - name: Verify critical startup exports
        run: |
          test -s src/App.jsx
          grep -q "export function App(" src/App.jsx
          test -s src/main.jsx
          grep -q "import { App } from './App.jsx'" src/main.jsx
          test -s index.html
          grep -q 'id="root"' index.html

      - name: Verify Vite output exists
        run: test -f dist/index.html

      - name: Auth / settings / metadata sanity check
        run: |
          node <<'NODE'
          const fs = require('fs')
          const read = (p) => fs.readFileSync(p, 'utf8')
          const checks = [
            ['src/Auth.jsx', 'shouldCreateUser: false'],
            ['src/Auth.jsx', 'signInWithOAuth'],
            ['src/Auth.jsx', 'shouldCreateUser: true'],
            ['src/Auth.jsx', 'Email OTP Sign Up'],
            ['src/Auth.jsx', 'Phone OTP Login'],
            ['src/Auth.jsx', 'Forgot Password'],
            ['src/App.jsx', 'finishAuthRedirect'],
            ['src/App.jsx', 'PASSWORD_RECOVERY'],
            ['src/App.jsx', 'AccountSettings'],
            ['src/App.jsx', 'account-settings'],
            ['src/App.css', 'reader-theme-paper'],
            ['src/App.jsx', 'readerPositionRestoredRef'],
            ['src/App.jsx', 'reduced-motion'],
            ['src/App.css', '.app.reduced-motion'],
            ['src/App.jsx', 'preload={accountSettings.dataSaver ? \'metadata\' : \'auto\'}'],
            ['src/App.jsx', 'applyEpubReaderAppearance'],
            ['src/App.jsx', 'Read Aloud'],
            ['src/AdminPanel.jsx', 'Management & Settings'],
            ['src/AdminPanel.jsx', 'AroLinks'],
            ['src/AdminPanel.jsx', 'Earn4Link'],
            ['server/shortenerUnlock.mjs', 'AROLINKS_API_TOKEN'],
            ['server/shortenerUnlock.mjs', 'EARN4LINK_API_TOKEN'],
            ['src/App.jsx', '/api/shortener/start'],
            ['src/App.jsx', '/api/shortener/complete'],
            ['src/lib/secureMedia.js', '/api/shortener/access'],
            ['supabase/production-shortener-unlock.sql', 'shortener_links'],
            ['supabase/production-shortener-unlock.sql', 'ad_unlocks'],
            ['src/AdminPanel.jsx', 'freeVideoEpisodes'],
            ['src/AdminPanel.jsx', 'content_access_settings'],
            ['src/App.jsx', 'isEpisodePreviewFree'],
            ['src/lib/secureMedia.js', "const protectedTypes = new Set(['premium', 'vip', 'ads'])"],
            ['supabase/production-content-repair.sql', 'create table if not exists public.app_settings'],
            ['supabase/email-templates/magic_link_otp.html', '{{ .Token }}'],
          ]
          for (const [file, needle] of checks) {
            if (!read(file).includes(needle)) throw new Error(`Missing required text: ${file} :: ${needle}`)
          }
          const app = read('src/App.jsx')
          if (app.includes('seedBooks') || app.includes('/books/')) {
            throw new Error('Legacy book seed/test references remain in src/App.jsx')
          }
          const template = read('supabase/email-templates/magic_link_otp.html')
          if (template.includes('{{ .ConfirmationURL }}')) throw new Error('Legacy confirmation URL remains in email template')
          for (const file of ['src/App.jsx','src/Auth.jsx','src/App.css','src/AccountSettings.jsx','src/AdminPanel.jsx','src/lib/secureMedia.js','server/shortenerUnlock.mjs','src/main.jsx','index.html','supabase/production-shortener-unlock.sql','supabase/production-content-repair.sql','supabase/email-templates/magic_link_otp.html']) {
            if (read(file).includes('localhost:3000')) throw new Error(`localhost:3000 remains in ${file}`)
          }
          console.log('Auth/settings/source sanity checks passed')
          NODE

      - name: Final source sanity check
        run: |
          ! grep -R -n "story?.id" src/App.jsx
          test -s src/AccountSettings.jsx
          grep -q "linkIdentity" src/AccountSettings.jsx
          grep -q "phone_change" src/AccountSettings.jsx
          grep -q "scope: 'global'" src/AccountSettings.jsx
          grep -q "getMediaPositionKey" src/App.jsx
          grep -q "dataSaver" src/App.jsx
          grep -q "hj_settings" src/App.jsx
          grep -q "reader-read-aloud-main" src/App.jsx
          grep -q "reader-bottom-read-aloud-row" src/App.jsx
          grep -q "accountSettings.ttsVolume" src/App.jsx
          grep -q "accountSettings.ttsSpeed" src/App.jsx
          grep -q "applyEpubReaderAppearance" src/App.jsx
          grep -q "reader-tools" src/App.css
          grep -q "reader-bottom-read-aloud-row" src/App.css
          ! awk '/^\.reader-body \.react-pdf__Page canvas \{/{flag=1} flag{print} /^\}/{if(flag){exit}}' src/App.css | grep -Eq "width:[[:space:]]*auto|height:[[:space:]]*auto"
          grep -q "max-width: none !important" src/App.css
          grep -q "reader-theme-paper" src/App.css
